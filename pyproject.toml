[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiedge"
version = "0.1.0"
description = "Automated Intelligent Enterprise Data Governance Ecosystem"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3>=1.34",
  "jsonschema>=4.22",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "spacy>=3.7",
  "transformers>=4.41",
]

[project.optional-dependencies]
ml = [
  # Single tensor runtime for both the transformer encoders and the LSTM:
  # PyTorch, with Keras 3 on the torch backend (KERAS_BACKEND=torch). This keeps
  # the proposal's Keras-based LSTM without a second framework (TensorFlow).
  "torch>=2.3",
  "keras>=3.3",
  "sentencepiece>=0.2",  # DeBERTa-v3 tokenizer
  "protobuf>=4.23",      # DeBERTa-v3 tokenizer conversion
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "moto>=5.0",
]
llm = [
  # LLM-backed content dataset generation (scripts/generate_content_llm.py)
  "anthropic>=0.69",
]
dashboard = [
  # Real-time governance dashboard service (aiedge.dashboard.app)
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",  # FastAPI file uploads
  "pypdf>=4.0",               # text-based PDF extraction (no OCR/ML)
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["aiedge*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# Never collect from build artifacts (Lambda package/ vendors third-party tests).
norecursedirs = ["infra", "ml", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["aiedge"]
